name: Temporary Whisper Large-Turbo Model Bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - .whisper-model-trigger

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download official multilingual Whisper large-v3-turbo q5 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -L --fail --retry 5 --retry-delay 3 \
            -o model/ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true'
          stat -c 'size=%s' model/ggml-large-v3-turbo-q5_0.bin | tee model/METADATA.txt
          sha256sum model/ggml-large-v3-turbo-q5_0.bin | tee model/SHA256SUMS
          test "$(stat -c%s model/ggml-large-v3-turbo-q5_0.bin)" -gt 500000000

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0-official
          path: model/
          retention-days: 1
          if-no-files-found: error
