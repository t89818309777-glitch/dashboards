name: Temporary Whisper Runtime Bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - .whisper-model-trigger

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build official whisper.cpp CPU binary
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.8.2 https://github.com/ggerganov/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release --target whisper-cli -j 2
          mkdir -p runtime
          cp whisper.cpp/build/bin/whisper-cli runtime/
          chmod +x runtime/whisper-cli
          runtime/whisper-cli --help >/dev/null

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-linux-x64-cpu
          path: runtime/whisper-cli
          retention-days: 1
          if-no-files-found: error
